services:
  mysql:
    image: mysql:8.4
    container_name: belong-us-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: belong_us
      MYSQL_ROOT_PASSWORD: change-me
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
